name: 📦 OpenClaw — 설치 및 설정 자동화

on:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: 'LLM 프로바이더 선택'
        required: true
        default: 'anthropic'
        type: choice
        options: [anthropic, vllm, openai, ollama]
      openclaw_version:
        description: 'OpenClaw 버전 (latest = 최신)'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  install:
    name: 📥 OpenClaw 설치 (${{ github.event.inputs.llm_provider || 'anthropic' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: OpenClaw 설치
        uses: ./.github/actions/setup-openclaw
        with:
          openclaw_version: ${{ github.event.inputs.openclaw_version || 'latest' }}

      - name: OpenClaw 설정 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          VLLM_API_KEY:      ${{ secrets.VLLM_API_KEY }}
          VLLM_BASE_URL:     ${{ vars.VLLM_BASE_URL }}
        run: |
          mkdir -p ~/.openclaw
          PROVIDER="${{ github.event.inputs.llm_provider || 'anthropic' }}"

          case $PROVIDER in
            anthropic)
              cat > ~/.openclaw/openclaw.json << EOF
          {
            "models": {
              "providers": {
                "anthropic": {
                  "baseUrl": "https://api.anthropic.com",
                  "apiKey": "${ANTHROPIC_API_KEY}",
                  "models": [
                    { "id": "claude-sonnet-4-5", "contextWindow": 200000 },
                    { "id": "claude-haiku-3-5",  "contextWindow": 200000 }
                  ]
                }
              },
              "primaryModel": "anthropic/claude-sonnet-4-5"
            },
            "gateway": { "port": 18789 }
          }
          EOF
              ;;
            vllm)
              cat > ~/.openclaw/openclaw.json << EOF
          {
            "models": {
              "providers": {
                "vllm": {
                  "baseUrl": "${VLLM_BASE_URL:-http://localhost:8000}",
                  "apiKey": "${VLLM_API_KEY:-no-auth}",
                  "api": "openai-completions",
                  "timeoutSeconds": 120,
                  "models": [
                    { "id": "qwen2.5-coder-32b", "contextWindow": 32768 }
                  ]
                }
              },
              "primaryModel": "vllm/qwen2.5-coder-32b"
            },
            "gateway": { "port": 18789 }
          }
          EOF
              ;;
            openai)
              cat > ~/.openclaw/openclaw.json << EOF
          {
            "models": {
              "providers": {
                "openai": {
                  "baseUrl": "https://api.openai.com",
                  "apiKey": "${OPENAI_API_KEY}",
                  "models": [
                    { "id": "gpt-4o", "contextWindow": 128000 }
                  ]
                }
              },
              "primaryModel": "openai/gpt-4o"
            },
            "gateway": { "port": 18789 }
          }
          EOF
              ;;
            ollama)
              cat > ~/.openclaw/openclaw.json << EOF
          {
            "models": {
              "providers": {
                "ollama": {
                  "baseUrl": "http://localhost:11434",
                  "apiKey": "ollama",
                  "api": "openai-completions",
                  "timeoutSeconds": 180,
                  "models": [
                    { "id": "llama3.2", "contextWindow": 8192 }
                  ]
                }
              },
              "primaryModel": "ollama/llama3.2"
            },
            "gateway": { "port": 18789 }
          }
          EOF
              ;;
          esac

          python3 -m json.tool ~/.openclaw/openclaw.json > /dev/null \
            && echo "✅ JSON 문법 검증 통과 (프로바이더: $PROVIDER)" \
            || { echo "❌ JSON 문법 오류"; exit 1; }

      - name: 게이트웨이 시작
        run: |
          GATEWAY_BIND=0.0.0.0 openclaw gateway start &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"

      - name: 게이트웨이 헬스체크
        uses: ./.github/actions/gateway-healthcheck
        with:
          timeout_seconds: '30'

      - name: 게이트웨이 종료
        if: always()
        run: kill "$GATEWAY_PID" 2>/dev/null || true

      - name: 설치 결과 요약
        if: always()
        run: |
          echo "## 📦 OpenClaw 설치 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 내용 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 버전 | $(openclaw --version 2>/dev/null || echo '확인 불가') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 프로바이더 | ${{ github.event.inputs.llm_provider || 'anthropic' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 실행 시각 | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
