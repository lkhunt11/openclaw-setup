name: 🚀 OpenClaw — 릴리스 배포

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  verify:
    name: 🔍 배포 전 검증
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: 버전 추출
        id: ver
        run: |
          VER="${GITHUB_REF_NAME:-$(date +%Y.%-m.0)}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "배포 버전: $VER"

      - name: 스크립트 린트 (shellcheck)
        run: |
          sudo apt-get install -y shellcheck -q
          find scripts/ -name "*.sh" -exec shellcheck --severity=warning {} \;
          echo "✅ 스크립트 린트 통과"

  staging:
    name: 🧪 스테이징 검증
    runs-on: ubuntu-latest
    needs: verify
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: OpenClaw 설치
        uses: ./.github/actions/setup-openclaw
        id: openclaw

      - name: 게이트웨이 시작
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          GATEWAY_BIND=0.0.0.0 openclaw gateway start &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"

      - name: 게이트웨이 헬스체크
        uses: ./.github/actions/gateway-healthcheck
        with:
          timeout_seconds: '30'

      - name: 게이트웨이 종료
        if: always()
        run: kill "$GATEWAY_PID" 2>/dev/null || true

      - name: Slack 알림
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🧪 *OpenClaw 스테이징* `${{ job.status }}`
            버전: `${{ needs.verify.outputs.version }}`
            OpenClaw: `${{ steps.openclaw.outputs.openclaw_version }}`
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  production:
    name: 🚀 프로덕션 배포
    runs-on: ubuntu-latest
    needs: [verify, staging]
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/latest

    steps:
      - uses: actions/checkout@v4

      - name: GitHub Release 생성
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.verify.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name: version,
              name: `OpenClaw Setup ${version}`,
              body: [
                `## 🦞 OpenClaw Windows/WSL2 자동 설치 ${version}`,
                '',
                '### 빠른 설치',
                '```bash',
                'npm install -g openclaw',
                'GATEWAY_BIND=0.0.0.0 openclaw gateway start',
                '```',
                '',
                '### 변경사항',
                '자세한 내용은 [CHANGELOG](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/commits/' + version + ')를 참고하세요.',
              ].join('\n'),
              draft: false,
              prerelease: version.includes('-'),
            });
            console.log('✅ Release: ' + data.html_url);
            core.setOutput('release_url', data.html_url);

      - name: Slack 알림
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 *OpenClaw 프로덕션 배포* `${{ job.status }}`
            버전: `${{ needs.verify.outputs.version }}`
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
