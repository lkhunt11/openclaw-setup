name: 🔍 OpenClaw — 설치 전 환경 검증

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/**.sh'
      - '.github/workflows/openclaw-*.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: 🧪 환경 검증 (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 시스템 요구사항 확인
        run: |
          echo "=== 시스템 정보 ==="
          echo "OS: $(uname -a)"
          echo "디스크: $(df -h / | tail -1)"
          echo "메모리: $(free -h | grep Mem)"

      - name: OpenClaw 최신 버전 조회
        run: |
          LATEST=$(npm view openclaw version 2>/dev/null || echo "조회 실패")
          echo "OpenClaw 최신 버전: $LATEST"
          if lsof -i:18789 > /dev/null 2>&1; then
            echo "⚠️  포트 18789 이미 사용 중"
          else
            echo "✅ 포트 18789 사용 가능"
          fi

      - name: 스크립트 실행 권한 설정
        run: chmod +x scripts/*.sh

      - name: 셸 스크립트 린트 (shellcheck)
        run: |
          sudo apt-get install -y shellcheck -q
          echo "=== shellcheck 결과 ==="
          shellcheck --severity=warning scripts/*.sh
          echo "✅ 셸 스크립트 린트 통과"

      - name: Node.js 22 + OpenClaw 설치 검증
        uses: ./.github/actions/setup-openclaw
        id: openclaw

      - name: 설치 결과 요약
        if: always()
        run: |
          echo "## 🔍 환경 검증 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 내용 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node.js | $(node --version) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm | $(npm --version) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenClaw | ${{ steps.openclaw.outputs.openclaw_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 확인 시각 | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
